# Publishes the Phase 0 spike test pages by pushing them to the gh-pages
# branch, which GitHub Pages serves (auto-enabled by the branch's existence,
# R46). The earlier configure-pages/deploy-pages route failed: GITHUB_TOKEN
# cannot create the Pages site ("Resource not accessible by integration").
# Approved by Lando 2026-08-30. Publishes /spikes content only.
name: spike-pages

on:
  push:
    branches: [main]
    paths:
      - "spikes/**"
      - ".github/workflows/spike-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site from spike pages
        run: |
          mkdir -p _site/s1 _site/s4
          cp spikes/index.html _site/
          touch _site/.nojekyll
          cp spikes/s1-client-audio/dist/index.html spikes/s1-client-audio/dist/bundle.js _site/s1/
          cp spikes/s4-latency-cal/index.html spikes/s4-latency-cal/xcorr.mjs _site/s4/
      - name: Push to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish spike pages from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
