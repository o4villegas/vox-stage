<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #06080F; color: #F3F5F9; font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; font-variation-settings: "opsz" 14; }
    a { color: #5B8CFF; } a:hover { color: #8FB0FF; }
    .mono { font-family: "IBM Plex Mono", "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
    .lane { display: flex; align-items: center; gap: 10px; height: 26px; }
    .lane .n { width: 30px; font-size: 11px; color: #848CA0; text-align: right; }
    .lane .t { flex: 1 1 auto; height: 1px; background: rgba(255,255,255,0.10); }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #06080F; display: flex; flex-direction: column; box-sizing: border-box; padding: 54px 24px 34px; gap: 18px;">
  <div style="position: absolute; left: 50%; top: 300px; width: 360px; height: 360px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle, rgba(255,244,224,0.55), rgba(255,244,224,0.12) 40%, rgba(6,8,15,0) 70%); filter: blur(30px);"></div>
  <div style="display: flex; align-items: center; justify-content: space-between; position: relative;">
    <div style="display: flex; align-items: center; gap: 10px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#AEB5C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg><span style="font-size: 13px; font-weight: 500; letter-spacing: 0.02em; color: #AEB5C4;">VOICE CHECK</span></div>
    <div style="display: flex; gap: 6px;"><div style="width: 22px; height: 4px; border-radius: 2px; background: #F3F5F9;"></div><div style="width: 22px; height: 4px; border-radius: 2px; background: #F3F5F9;"></div><div style="width: 22px; height: 4px; border-radius: 2px; background: #171B26;"></div></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px; position: relative;">
    <h1 style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -0.015em; font-variation-settings: 'opsz' 48;">Slide up to your highest comfortable note.</h1>
    <p style="margin: 0; font-size: 15px; line-height: 22px; color: #AEB5C4;">Then hold it for two seconds. Stop where it starts to strain.</p>
  </div>
  <div style="flex: 1 1 auto; display: grid; grid-template-columns: 1fr 150px; gap: 16px; align-items: stretch; position: relative;">
    <div style="display: flex; flex-direction: column; justify-content: space-between; padding: 6px 0;">
      <div class="lane"><span class="n mono">C5</span><span class="t"></span></div>
      <div class="lane"><span class="n mono">B4</span><span class="t"></span></div>
      <div class="lane" style="position: relative;"><span class="n mono" style="color: #F3F5F9; font-weight: 600;">A4</span><span class="t" style="height: 2px; background: #FFF4E0; box-shadow: 0 0 18px 2px rgba(255,244,224,0.8);"></span></div>
      <div class="lane"><span class="n mono">G4</span><span class="t"></span></div>
      <div class="lane"><span class="n mono">F4</span><span class="t"></span></div>
      <div class="lane"><span class="n mono">E4</span><span class="t"></span></div>
      <div class="lane"><span class="n mono">D4</span><span class="t"></span></div>
      <div class="lane"><span class="n mono">C4</span><span class="t"></span></div>
      <div class="lane"><span class="n mono">B3</span><span class="t"></span></div>
      <div class="lane"><span class="n mono">A3</span><span class="t"></span></div>
      <div class="lane"><span class="n mono">G3</span><span class="t"></span></div>
      <div class="lane"><span class="n mono">F3</span><span class="t"></span></div>
      <div class="lane"><span class="n mono">E3</span><span class="t"></span></div>
      <div class="lane"><span class="n mono">D3</span><span class="t"></span></div>
      <div class="lane"><span class="n mono">C3</span><span class="t"></span></div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;">
      <div class="mono" style="font-size: 88px; line-height: 1; font-weight: 500; letter-spacing: -0.05em; text-shadow: 0 0 40px rgba(255,244,224,0.55);">A4</div>
      <div class="mono" style="font-size: 16px; color: #AEB5C4;">+6&#162;</div>
      <div style="position: relative; width: 92px; height: 92px;">
        <svg width="92" height="92" viewBox="0 0 92 92"><circle cx="46" cy="46" r="40" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="6"></circle><circle cx="46" cy="46" r="40" fill="none" stroke="#FFF4E0" stroke-width="6" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="100" transform="rotate(-90 46 46)"></circle></svg>
        <div class="mono" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #F3F5F9;">1.2 s</div>
      </div>
      <div style="font-size: 12px; color: #848CA0; text-align: center;">hold</div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px; position: relative;">
    <div style="height: 52px; border-radius: 14px; background: #171B26; color: #F3F5F9; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.09);">That's my top note</div>
    <div style="height: 44px; border-radius: 14px; color: #AEB5C4; font-weight: 500; font-size: 15px; display: flex; align-items: center; justify-content: center;">Start over</div>
  </div>
</div>
</x-dc>
</body>
</html>
