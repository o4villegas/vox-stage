<!doctype html>
<html>

<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #06080F; color: #F3F5F9; font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; font-variation-settings: "opsz" 14; }
    a { color: #5B8CFF; } a:hover { color: #8FB0FF; }
    .mono { font-family: "IBM Plex Mono", "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #06080F; display: flex; flex-direction: column; box-sizing: border-box; padding: 54px 24px 34px;">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 10px; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.22) 0 1px, transparent 1px 13px); opacity: 0.8;"></div>
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 18px; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.28) 0 1px, transparent 1px 65px);"></div>
  <div style="position: absolute; left: 50%; bottom: -140px; width: 420px; height: 320px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255,244,224,0.22), rgba(108,124,255,0.10) 45%, rgba(6,8,15,0) 70%); filter: blur(22px);"></div>
  <div style="display: flex; align-items: center; justify-content: space-between; position: relative;">
    <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; font-variation-settings: 'opsz' 48;">VoxStage</div>
    <div class="mono" style="font-size: 11px; color: #848CA0; letter-spacing: 0.08em;">BETA</div>
  </div>
  <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 28px; position: relative;">
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <h1 style="margin: 0; font-size: 44px; line-height: 46px; font-weight: 600; letter-spacing: -0.03em; font-variation-settings: 'opsz' 96; text-wrap: balance;">Sing everything in <span style="background: linear-gradient(90deg, #6C7CFF, #FFF4E0 60%, #FF6B8A); -webkit-background-clip: text; background-clip: text; color: transparent;">your key.</span></h1>
      <p style="margin: 0; font-size: 16px; line-height: 24px; color: #AEB5C4; max-width: 30ch;">Find your range once. Every song you upload is moved to fit it, and you see exactly how close you sing.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 13px; font-weight: 500; letter-spacing: 0.02em; color: #AEB5C4;">Email</div>
        <div style="height: 52px; border-radius: 14px; background: #171B26; border: 1px solid rgba(255,255,255,0.09); padding: 0 16px; display: flex; align-items: center; color: #848CA0; font-size: 17px;">you@example.com</div>
      </div>
      <div style="height: 52px; border-radius: 14px; background: #171B26; color: #848CA0; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center;">Continue</div>
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: #848CA0;">We'll email you a six-digit code. There's no password.</p>
    </div>
  </div>
  <div style="display: flex; justify-content: center; gap: 18px; font-size: 12px; color: #848CA0; position: relative;"><span>Privacy</span><span>Terms</span><span class="mono">v0.2</span></div>
</div>
